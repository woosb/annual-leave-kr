name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      # 실제로 17 런타임에서 돌아가는지 확인한다.
      # release=17 설정을 믿지 말고 검증하는 쪽이 낫다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify bytecode runs on JDK 17
        run: |
          javap -verbose -cp build/classes/java/main \
            io.github.woosb.annualleave.AnnualLeaveCalculator \
            | grep 'major version' | grep -q '61' \
            && echo "OK: major version 61 (Java 17)" \
            || (echo "FAIL: 바이트코드 타겟이 17 이 아니다" && exit 1)
